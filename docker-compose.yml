# Local dev stack for ONE checkout (main or a worktree). It has no published
# ports for frontend/backend: both are reached through the shared nginx proxy
# in docker/proxy (started by `make up` / `make proxy-up`) on
#
#   api.<base>    -> backend   (Symfony REST API)
#   admin.<base>  -> frontend  (Next.js, super-admin context)
#   <tenant>.<base> -> frontend (Next.js, tenant context)
#
# where <base> is kozijnr.localhost for the main checkout and
# koz-<n>.kozijnr.localhost for the KOZ-n worktree. The proxy finds this
# stack on the external `kozijnr-proxy` network by the aliases
# <COMPOSE_PROJECT_NAME>-frontend / <COMPOSE_PROJECT_NAME>-backend.
#
# COMPOSE_PROJECT_NAME (namespaces container/volume names + the proxy
# aliases), DATABASE_PORT and APP_BASE_DOMAIN are read from the .env file in
# this directory; `make up` generates it (scripts/setup-worktree-env.sh). The
# defaults below are the main checkout's.
services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      # The only published port: for a DB client on the host. Per worktree
      # unique (5432 + <n>) so stacks can run side by side.
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./docker/backend
    volumes:
      - ./api:/app
      - backend_vendor:/app/vendor
    environment:
      APP_ENV: dev
      DATABASE_URL: "postgresql://app:app@database:5432/app?serverVersion=16&charset=utf8"
      # Real container env var (wins over api/.env): which base domain this
      # stack's hostnames hang under, used for tenant/admin/api subdomain
      # resolution, CORS and cookie scope. See api/config/services.yaml.
      APP_BASE_DOMAIN: "${APP_BASE_DOMAIN:-kozijnr.localhost}"
    networks:
      default: {}
      proxy:
        aliases:
          - "${COMPOSE_PROJECT_NAME:-kozijnr}-backend"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./docker/frontend
    volumes:
      - ./web:/app
      - frontend_node_modules:/app/node_modules
    environment:
      WATCHPACK_POLLING: "true"
    networks:
      default: {}
      proxy:
        aliases:
          - "${COMPOSE_PROJECT_NAME:-kozijnr}-frontend"
    depends_on:
      - backend

networks:
  proxy:
    external: true
    name: kozijnr-proxy

volumes:
  database_data:
  backend_vendor:
  frontend_node_modules:
