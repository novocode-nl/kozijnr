security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        App\User\Domain\User: 'auto'
        App\TenantUser\Domain\TenantUser: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    #
    # super_admins: KOZ-8's public-schema-only admin realm, backed by
    # App\User\Infrastructure\Security\UserProvider (this bounded context's
    # own UserRepositoryInterface port), never by tenant data. The generic
    # `users` table (public schema) is role-based — today only
    # ROLE_SUPER_ADMIN accounts exist in it, created
    # via `bin/console super-admin:create` — so future admin-side roles fit
    # into this same table/provider.
    #
    # No separate `tenant_users` provider is declared here: the
    # `tenant_users` firewall's access_token authenticator resolves a
    # TenantUser directly via its token handler
    # (App\TenantUser\Infrastructure\Security\TenantApiTokenHandler), whose
    # UserBadge already carries a loader closure — Symfony never needs a
    # provider to refresh it against for a stateless firewall.
    providers:
        super_admins:
            id: App\User\Infrastructure\Security\UserProvider

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # Tenant-independent super-admin realm (KOZ-8). Matched by path
        # only — App\Tenancy\Infrastructure\AdminRouteGuardListener
        # (priority 90, runs before this firewall at priority 8) already
        # 404s every /api/admin/* request that tenant resolution did not
        # mark as being on the reserved admin subdomain (admin.kozijnr.nl /
        # admin.localhost), so by the time this firewall ever authenticates
        # anything, the request is guaranteed to be on the admin domain.
        #
        # Session-based (not stateless): the session this firewall
        # establishes only ever stores the logged-in User's own identity
        # (email via App\User\Infrastructure\Security\UserProvider) — no
        # tenant/schema data is ever put into it, so there is nothing in it
        # that could carry tenant context across to a tenant request even
        # if the cookie were replayed there.
        super_admin:
            pattern: ^/api/admin
            provider: super_admins
            json_login:
                check_path: admin_login
                username_path: email
                password_path: password
                success_handler: App\User\Infrastructure\Security\AuthenticationSuccessHandler
                failure_handler: App\User\Infrastructure\Security\AuthenticationFailureHandler
            logout:
                path: admin_logout

        # Tenant-user realm (KOZ-11): stateless bearer-token auth for
        # requests resolved to a real tenant subdomain
        # (App\Tenancy\Infrastructure\TenantResolverListener +
        # App\TenantUser\Infrastructure\TenantRouteGuardListener, which
        # 404s /api/login and /api/me everywhere else). /api/login itself
        # issues the token (App\TenantUser\Infrastructure\Controller\LoginController)
        # rather than being authenticated by this firewall — see
        # access_control below, which leaves it at PUBLIC_ACCESS.
        #
        # stateless: true — no session/cookie is ever established here, on
        # purpose: a bearer token is looked up fresh on every request via
        # TenantApiTokenHandler, scoped to the current tenant schema by
        # search_path alone, so there is nothing session-based that could
        # ever be replayed across tenant subdomains (KOZ-11 DoD).
        tenant_users:
            pattern: ^/api
            stateless: true
            access_token:
                token_handler: App\TenantUser\Infrastructure\Security\TenantApiTokenHandler

        # Everything else (the bare main domain, /api/health, ...) stays
        # unauthenticated at the Symfony Security layer.
        main:
            lazy: true
            security: false

    # Note: Only the *first* matching rule is applied.
    #
    # Login/logout stay ROLE_SUPER_ADMIN-gated: authentication is who is
    # even allowed onto this firewall at all, which stays role-based by
    # design (KOZ-9). Every other /api/admin route only requires being
    # authenticated here — the fine-grained *permission* check
    # (tenant:list, tenant:create, ...) happens per-action via
    # #[IsGranted] on the controller (App\User\Infrastructure\Security\PermissionVoter),
    # not via a blanket role check at the access_control level.
    access_control:
        - { path: ^/api/admin/(login|logout)$, roles: PUBLIC_ACCESS }
        - { path: ^/api/admin, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/me$, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            App\User\Domain\User:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
            App\TenantUser\Domain\TenantUser:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
