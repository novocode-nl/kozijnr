# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Domain requests are matched against to detect a tenant subdomain, e.g.
    # a request to "acme.<base>" resolves tenant "acme"; a request to
    # "<base>" itself (or any host not ending in ".<base>") stays on the
    # public schema. Locally this is "kozijnr.localhost" (main checkout) or
    # "koz-<n>.kozijnr.localhost" (worktree) — see README.md "Local domains
    # via nginx"; in production the real apex domain, e.g. kozijnr.nl.
    # Also used by CorsListener to decide which browser origins may call
    # this API on api.<base>.
    app.tenancy.base_domain: '%env(APP_BASE_DOMAIN)%'

    # Tenant migrations (per tenant-schema) live in a directory separate from
    # the public migrations under /migrations (config/packages/doctrine_migrations.yaml),
    # so the two sets never run against each other. See
    # App\Tenancy\Infrastructure\TenantSchemaMigrator and the KOZ-7 ticket.
    app.tenancy.migrations_path: '%kernel.project_dir%/migrations-tenant'

    # KOZ-32 file storage config switch — see .env "app/storage" section
    # for the full option list. Changing app.storage.adapter (env
    # APP_STORAGE_ADAPTER) between "local" and "s3" is the only change
    # needed to move from local dev storage to a production S3-compatible
    # bucket; App\Shared\Infrastructure\Storage\FlysystemAdapterFactory is
    # the only place that reads these.
    app.storage.adapter: '%env(APP_STORAGE_ADAPTER)%'
    app.storage.local_root: '%kernel.project_dir%/%env(APP_STORAGE_LOCAL_ROOT)%'
    app.storage.s3_bucket: '%env(APP_STORAGE_S3_BUCKET)%'
    app.storage.s3_region: '%env(APP_STORAGE_S3_REGION)%'
    app.storage.s3_endpoint: '%env(APP_STORAGE_S3_ENDPOINT)%'
    app.storage.s3_key: '%env(APP_STORAGE_S3_KEY)%'
    app.storage.s3_secret: '%env(APP_STORAGE_S3_SECRET)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Tenancy\Domain\TenantRepositoryInterface: '@App\Tenancy\Infrastructure\DoctrineTenantRepository'

    App\Tenancy\Domain\TenantSchemaContextInterface: '@App\Tenancy\Infrastructure\DbalTenantSchemaContext'

    App\User\Domain\UserRepositoryInterface: '@App\User\Infrastructure\DoctrineUserRepository'

    App\User\Domain\RoleRepositoryInterface: '@App\User\Infrastructure\DoctrineRoleRepository'

    App\Shared\Domain\Security\PasswordHasherInterface: '@App\Shared\Infrastructure\Security\SymfonyPasswordHasher'

    App\TenantUser\Domain\TenantUserRepositoryInterface: '@App\TenantUser\Infrastructure\DoctrineTenantUserRepository'

    App\TenantUser\Domain\TenantApiTokenRepositoryInterface: '@App\TenantUser\Infrastructure\DoctrineTenantApiTokenRepository'

    App\Tenancy\Infrastructure\TenantResolverListener:
        arguments:
            $baseDomain: '%app.tenancy.base_domain%'

    App\Tenancy\Infrastructure\CorsListener:
        arguments:
            $baseDomain: '%app.tenancy.base_domain%'

    # The tenant token cookie is scoped to the base domain so it reaches both
    # api.<base> (where it is issued and validated) and the frontend hosts
    # (whose route guard checks for its presence) — see TenantApiTokenCookie.
    App\TenantUser\Infrastructure\Controller\LoginController:
        arguments:
            $baseDomain: '%app.tenancy.base_domain%'

    App\TenantUser\Infrastructure\Controller\LogoutController:
        arguments:
            $baseDomain: '%app.tenancy.base_domain%'

    App\Tenancy\Infrastructure\TenantSchemaMigrator:
        arguments:
            $migrationsPath: '%app.tenancy.migrations_path%'

    # KOZ-32: the Flysystem operator FlysystemFileStorage delegates to.
    # Built by FlysystemAdapterFactory purely from the app.storage.*
    # parameters above — this is the entire "config switch" between the
    # local dev adapter and an S3-compatible production adapter.
    League\Flysystem\FilesystemOperator:
        factory: ['App\Shared\Infrastructure\Storage\FlysystemAdapterFactory', 'create']
        arguments:
            $adapter: '%app.storage.adapter%'
            $localRoot: '%app.storage.local_root%'
            $s3Bucket: '%app.storage.s3_bucket%'
            $s3Region: '%app.storage.s3_region%'
            $s3Endpoint: '%app.storage.s3_endpoint%'
            $s3Key: '%app.storage.s3_key%'
            $s3Secret: '%app.storage.s3_secret%'

    App\Shared\Domain\Storage\FileStorageInterface: '@App\Shared\Infrastructure\Storage\FlysystemFileStorage'

    # public: true — otherwise Symfony's single-consumer inlining
    # optimization would remove this alias entirely (only
    # UploadProfilePhoto depends on it today), making it unfetchable from
    # integration tests via self::getContainer()->get(...).
    App\ProfilePhoto\Domain\ProfilePhotoRepositoryInterface:
        alias: App\ProfilePhoto\Infrastructure\DoctrineProfilePhotoRepository
        public: true
