# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Domain requests are matched against to detect a tenant subdomain, e.g.
    # a request to "acme.<base>" resolves tenant "acme"; a request to
    # "<base>" itself (or any host not ending in ".<base>") stays on the
    # public schema. See README.md for how to test this locally with
    # *.localhost subdomains.
    app.tenancy.base_domain: '%env(APP_BASE_DOMAIN)%'

    # Tenant migrations (per tenant-schema) live in a directory separate from
    # the public migrations under /migrations (config/packages/doctrine_migrations.yaml),
    # so the two sets never run against each other. See
    # App\Tenancy\Infrastructure\TenantSchemaMigrator and the KOZ-7 ticket.
    app.tenancy.migrations_path: '%kernel.project_dir%/migrations-tenant'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Tenancy\Domain\TenantRepositoryInterface: '@App\Tenancy\Infrastructure\DoctrineTenantRepository'

    App\User\Domain\UserRepositoryInterface: '@App\User\Infrastructure\DoctrineUserRepository'

    App\Tenancy\Infrastructure\TenantResolverListener:
        arguments:
            $baseDomain: '%app.tenancy.base_domain%'

    App\Tenancy\Infrastructure\TenantSchemaMigrator:
        arguments:
            $migrationsPath: '%app.tenancy.migrations_path%'
