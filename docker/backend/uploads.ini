; KOZ-32: PHP's built-in defaults (upload_max_filesize=2M, post_max_size=8M)
; reject a file between 2MB and the application's own 5MB limit
; (UploadProfilePhoto::MAX_SIZE_IN_BYTES) before it ever reaches the
; application layer, with a generic UPLOAD_ERR_INI_SIZE that the controller
; can't distinguish from "no file at all". Set both explicitly, comfortably
; above the 5MB application limit, so the application's own tooLarge check
; is what actually enforces the advertised limit.
upload_max_filesize = 6M
post_max_size = 8M
