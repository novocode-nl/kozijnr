# Shared local reverse proxy: ONE nginx for the main checkout and every
# worktree, started once with `make proxy-up` (from any checkout; `make up`
# does it for you). It routes purely on hostname over the external Docker
# network `kozijnr-proxy`, which every app stack joins with a predictable
# alias (<COMPOSE_PROJECT_NAME>-frontend / -backend, see ../../docker-compose.yml):
#
#   api.kozijnr.localhost            -> kozijnr-backend:8000   (main)
#   admin|<tenant>.kozijnr.localhost -> kozijnr-frontend:3000  (main)
#   api.koz-<n>.kozijnr.localhost    -> koz-<n>-backend:8000   (worktree KOZ-n)
#   *.koz-<n>.kozijnr.localhost      -> koz-<n>-frontend:3000  (worktree KOZ-n)
#
# *.localhost resolves to 127.0.0.1 in every browser without DNS setup.
# PROXY_PORT (default 80) can be overridden via a .env next to this file if
# something else already owns port 80 on the host (e.g. Laravel Valet).
name: kozijnr-proxy

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${PROXY_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./proxy-common.inc:/etc/nginx/conf.d/proxy-common.inc:ro
    networks:
      - proxy
    restart: unless-stopped

networks:
  proxy:
    external: true
    name: kozijnr-proxy
