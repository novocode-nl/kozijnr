# Hostname-based routing for every Kozijnr stack on the kozijnr-proxy
# network (see docker-compose.yml in this directory for the full picture).
#
# Upstream names are resolved per request through Docker's embedded DNS
# (127.0.0.11) and passed as variables, so stacks can start and stop at any
# time without restarting this proxy; a stack that isn't running simply
# yields a 502 for its hostnames.
resolver 127.0.0.11 valid=5s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# api.koz-<n>.kozijnr.localhost -> that worktree's backend
server {
    listen 80;
    server_name ~^api\.(?<project>koz-\d+)\.kozijnr\.localhost$;
    location / {
        include /etc/nginx/conf.d/proxy-common.inc;
        proxy_pass http://$project-backend:8000;
    }
}

# api.kozijnr.localhost -> main checkout's backend
server {
    listen 80;
    server_name api.kozijnr.localhost;
    location / {
        include /etc/nginx/conf.d/proxy-common.inc;
        set $upstream kozijnr-backend;
        proxy_pass http://$upstream:8000;
    }
}

# <admin|tenant>.koz-<n>.kozijnr.localhost -> that worktree's frontend
server {
    listen 80;
    server_name ~^[^.]+\.(?<project>koz-\d+)\.kozijnr\.localhost$;
    location / {
        include /etc/nginx/conf.d/proxy-common.inc;
        proxy_pass http://$project-frontend:3000;
    }
}

# <admin|tenant>.kozijnr.localhost -> main checkout's frontend
server {
    listen 80;
    server_name ~^[^.]+\.kozijnr\.localhost$;
    location / {
        include /etc/nginx/conf.d/proxy-common.inc;
        set $upstream kozijnr-frontend;
        proxy_pass http://$upstream:3000;
    }
}

# Anything else: explain instead of silently serving the wrong stack.
server {
    listen 80 default_server;
    server_name _;
    default_type text/plain;
    return 404 "kozijnr-proxy: unknown host.\nUse api|admin|<tenant>.kozijnr.localhost (main) or api|admin|<tenant>.koz-<n>.kozijnr.localhost (worktree KOZ-n).\n";
}
